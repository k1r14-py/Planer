<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Planer</title>
    <style>
      :root { color-scheme: light dark; --bg: #f5f5f8; --text: #17171c; --muted: #5d5d6c; --accent: #6d5efc; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0e12; --text: #ececf1; --muted: #a5a5b4; --accent: #8577ff; } }
      html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; }
      .box { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 24px; }
      .logo { width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
        background: linear-gradient(135deg, #8b7fff, #5a48f0); box-shadow: 0 12px 32px #5a48f040; }
      .spinner { width: 22px; height: 22px; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
        border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
      #status { color: var(--muted); font-size: 14px; min-height: 20px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1>Planer</h1>
      <div class="spinner"></div>
      <div id="status">Запускаю…</div>
    </div>
    <script>
      window.setStatus = (text) => (document.getElementById("status").textContent = text);
    </script>
  </body>
</html>
